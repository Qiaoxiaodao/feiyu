    <style>
        body { background-color: #faf6f0; font-family: 'ZCOOL KuaiLe', sans-serif; color: #2b2b2b; }
        .sketch-border { border: 3px solid #2b2b2b; }
        .sketch-shadow { box-shadow: 6px 6px 0px rgba(43, 43, 43, 1); }
        .pulse-remind { animation: strong-breath 1.5s infinite ease-in-out; border: 4px solid #ef4444 !important; }
        @keyframes strong-breath {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0px rgba(239, 68, 68, 0); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(239, 68, 68, 0.6); }
        }
    </style>
</head>
<body x-data="trackerApp()" x-init="initApp()" class="p-4 md:p-8 min-h-screen">

    <header class="mb-8">
        <div class="flex justify-between items-center bg-[#fdfaf2] p-6 sketch-border sketch-shadow">
            <h1 class="text-3xl font-black">🚀 FEIYU天天向上团队看板</h1>
            <div x-text="currentTime" class="font-bold text-xl"></div>
        </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
        <template x-for="m in members" :key="m.id">
            <div class="bg-white sketch-border p-6 sketch-shadow flex flex-col" :class="shouldPulse(m) ? 'pulse-remind' : ''">
                <!-- 头部：头像与姓名 -->
                <div class="flex items-center gap-4 mb-4">
                    <div @click="openAvatarModal(m.id)" class="w-16 h-16 border-2 border-[#2b2b2b] cursor-pointer overflow-hidden">
                        <img v-if="m.customAvatar" :src="m.customAvatar" class="w-full h-full object-cover">
                        <div v-else class="w-full h-full bg-gray-200"></div>
                    </div>
                    <h2 class="text-2xl font-black" x-text="m.name"></h2>
                </div>

                <!-- 任务清单 -->
                <ul class="space-y-2 mb-4 flex-grow">
                    <template x-for="task in m.tasks" :key="task.id">
                        <li class="flex items-center justify-between p-2 border-b border-gray-100">
                            <span x-text="task.text" :class="task.state === 'green' ? 'line-through text-gray-400' : ''"></span>
                            <div class="flex gap-1">
                                <button @click="changeTaskState(m, task.id, 'red')" class="w-6 h-6 bg-red-200"></button>
                                <button @click="changeTaskState(m, task.id, 'orange')" class="w-6 h-6 bg-orange-200"></button>
                                <button @click="changeTaskState(m, task.id, 'green')" class="w-6 h-6 bg-green-200"></button>
                            </div>
                        </li>
                    </template>
                </ul>

                <!-- 备注 -->
                <div class="mt-4">
                    <label class="text-xs font-bold block mb-1">今日备注：</label>
                    <input type="text" x-model="m.remark" @blur="saveData()" class="w-full p-2 border sketch-border" placeholder="记录进度...">
                </div>
            </div>
        </template>
    </main>

    <!-- 历史数据 -->
    <section class="bg-white p-6 sketch-border sketch-shadow">
        <h2 class="text-xl font-black mb-4">📜 历史进度概览</h2>
        <template x-for="item in history" :key="item.date">
            <div class="p-2 border-b text-sm">
                <span x-text="item.date"></span>: <span x-text="item.remark"></span>
            </div>
        </template>
    </section>

    <!-- 头像弹窗 -->
    <div x-show="avatarModalOpen" class="fixed inset-0 bg-black/50 flex items-center justify-center">
        <div class="bg-white p-6 sketch-border">
            <h3 class="font-bold mb-4">更换头像</h3>
            <input type="file" @change="uploadAvatar($event)" accept="image/*">
            <button @click="avatarModalOpen=false" class="mt-4 block bg-gray-200 px-4 py-2">关闭</button>
        </div>
    </div>

    <script>
        function trackerApp() {
            return {
                currentTime: new Date().toLocaleTimeString(),
                members: [],
                history: [],
                avatarModalOpen: false,
                currentMId: null,

                initApp() {
                    setInterval(() => this.currentTime = new Date().toLocaleTimeString(), 1000);
                    this.loadData();
                },

                loadData() {
                    const localData = localStorage.getItem('feiyu_data');
                    if (localData) {
                        const parsed = JSON.parse(localData);
                        this.members = parsed.members;
                        this.history = parsed.history;
                    } else {
                        this.members = [
                            { id: 1, name: 'SY', tasks: [{id:1, text:'任务1', state:'red'}], remark: '', customAvatar: '' },
                            { id: 2, name: 'YCF', tasks: [{id:2, text:'任务2', state:'red'}], remark: '', customAvatar: '' }
                        ];
                    }
                },

                saveData() {
                    localStorage.setItem('feiyu_data', JSON.stringify({ members: this.members, history: this.history }));
                },

                changeTaskState(m, tid, state) {
                    const t = m.tasks.find(x => x.id === tid);
                    if(t) t.state = state;
                    this.saveData();
                },

                shouldPulse(m) {
                    const now = new Date();
                    const isLate = now.getHours() >= 18 && now.getMinutes() >= 30;
                    return isLate && m.tasks.some(t => t.state !== 'green');
                },

                openAvatarModal(id) {
                    this.currentMId = id;
                    this.avatarModalOpen = true;
                },

                uploadAvatar(event) {
                    const file = event.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const m = this.members.find(x => x.id === this.currentMId);
                        if(m) m.customAvatar = e.target.result;
                        this.saveData();
                        this.avatarModalOpen = false;
                    };
                    reader.readAsDataURL(file);
                }
            }
        }
    </script>
</body>
</html>
