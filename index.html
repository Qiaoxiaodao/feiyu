<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEIYU天天向上</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 🚀 引入 Supabase 实时云端数据库支持库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');
        
        body {
            font-family: 'Nunito', 'Kaiti', 'STKaiti', 'KaiTi_GB2312', sans-serif;
            background-color: #fef9ec; /* 温暖浅黄色底 */
            color: #333;
        }

        /* 极简直线手绘边框 */
        .sketch-border {
            border: 2px solid #2d3748;
            border-radius: 8px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
        }
        
        .sketch-border-sm {
            border: 2px solid #2d3748;
            border-radius: 6px;
        }

        /* 手绘按钮交互 */
        .sketch-btn {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .sketch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
        }
        .sketch-btn:active {
            transform: translateY(1px);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        /* 催办呼吸状态 */
        @keyframes pulsing-alert {
            0%, 100% { transform: scale(1); color: inherit; }
            50% { transform: scale(1.05); color: #ef4444; }
        }
        .pulsing-alert {
            animation: pulsing-alert 1.5s ease-in-out infinite;
            transform-origin: left center;
        }

        /* 任务单条状态色 */
        .task-bg-red { background-color: #FEE2E2; }
        .task-bg-orange { background-color: #FEF3C7; }
        .task-bg-green { background-color: #D1FAE5; }
        .task-bg-red-carry { background-color: #FCA5A5; }
        .task-bg-orange-carry { background-color: #FDBA74; }
        .carryover-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border: 1px solid #2d3748;
            border-radius: 999px;
            background: rgba(255,255,255,0.78);
            white-space: nowrap;
        }
         .stats-avatar-clickable { cursor: pointer; overflow: visible; }
        .stats-avatar-clickable:hover { transform: scale(1.08); }
        /* 修复统计区头像：让 SVG/图片在小尺寸容器里也按 100% 显示 */
        .stats-avatar-clickable svg,
        #member-stats-avatar svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .stats-avatar-clickable img,
        #member-stats-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .task-done {
            text-decoration: line-through;
            text-decoration-thickness: 2px;
            text-decoration-color: #2d3748;
            opacity: 0.6;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col">

    <!-- 顶部导航条 -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-amber-100 p-4 sketch-border">
        <div class="flex items-center gap-4 flex-wrap justify-center">
            <h1 class="text-3xl md:text-4xl font-bold tracking-wider text-gray-800">💪 FEIYU天天向上</h1>
            <span id="current-time" class="text-base md:text-lg font-bold sketch-border-sm px-3 py-1 bg-yellow-50 text-amber-900">
                加载中...
            </span>
            <span id="sync-status" class="text-xs font-bold px-2 py-1 bg-gray-100 text-gray-500 rounded-full ml-2 cursor-pointer" onclick="initData()" title="点击尝试重新连接">
                ☁️ 检查连接中...
            </span>
        </div>
        <div class="flex flex-wrap gap-3 justify-center items-center">
            <div id="identity-controls" class="sketch-border-sm bg-white px-3 py-2 flex items-center gap-2 text-sm font-bold">
                <span>👤 当前身份</span>
                <select id="identity-select" class="bg-yellow-50 sketch-border-sm px-2 py-1 outline-none" onchange="switchIdentity(this.value)">
                    <option value="boss">老板</option>
                </select>
            </div>
            <button onclick="openStatsModal()" class="sketch-border sketch-btn bg-white px-4 py-2 font-bold hover:bg-yellow-50">📊 数据分析</button>
            <button onclick="openTaskModal()" class="sketch-border sketch-btn bg-indigo-100 px-4 py-2 font-bold hover:bg-indigo-200">📝 管理任务库</button>
        </div>
    </header>

    <!-- 看板主区域 -->
    <main id="board-view" class="flex-1">
        <div id="card-container" class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
            <!-- 成员方块卡片将由 JavaScript 渲染 -->
        </div>
    </main>

    <!-- 底部常驻面板 -->
    <footer class="mt-8 pt-8 border-t-2 border-gray-300 grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- 底部数据分析概览 -->
        <div class="sketch-border bg-[#fffdf5] p-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                <h2 class="text-2xl font-bold">📊 数据统计与完成率概览</h2>
                <div class="flex flex-wrap items-center gap-1.5 bg-yellow-50/60 p-1.5 sketch-border-sm text-xs">
                    <input type="date" id="bottom-stat-start" class="sketch-border-sm px-1.5 py-0.5 bg-white scale-90 md:scale-100">
                    <span>至</span>
                    <input type="date" id="bottom-stat-end" class="sketch-border-sm px-1.5 py-0.5 bg-white scale-90 md:scale-100">
                    <button onclick="renderBottomStats()" class="sketch-border-sm sketch-btn px-2 py-0.5 bg-blue-100 font-bold">查询</button>
                    <button onclick="setBottomQuickDate('week')" class="sketch-border-sm px-2 py-0.5 bg-white hover:bg-gray-100">本周</button>
                    <button onclick="setBottomQuickDate('month')" class="sketch-border-sm px-2 py-0.5 bg-white hover:bg-gray-100">30天</button>
                </div>
            </div>
            <div id="bottom-chart-container" class="flex items-end justify-around h-48 border-b-2 border-l-2 border-gray-800 pb-2 pl-2 relative bg-white/50 rounded p-2">
                <!-- 柱状图由JS渲染 -->
            </div>
        </div>

        <!-- 历史动态日志 -->
        <div class="sketch-border bg-[#fffdf5] p-6">
            <h2 class="text-2xl font-bold mb-6">📜 团队实时动态 (历史打卡与备注)</h2>
            <div id="action-history" class="h-48 overflow-y-auto flex flex-col gap-3 pr-2">
                <!-- 动态由JS渲染 -->
            </div>
        </div>
    </footer>

    <!-- 数据分析详细模态弹窗 -->
    <div id="stats-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-50">
        <div class="sketch-border bg-[#fffdf5] p-6 max-w-5xl w-full mx-4 max-h-[90vh] overflow-y-auto relative">
            <button onclick="closeStatsModal()" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 font-bold text-2xl">✖</button>
            <h2 class="text-2xl font-bold mb-6">数据统计报表 (按日积分均值折算)</h2>
            
            <div class="flex flex-wrap items-center gap-2 bg-yellow-50 p-2 sketch-border-sm mb-6 w-max">
                <span class="font-bold text-sm">时间范围:</span>
                <input type="date" id="stat-start" class="sketch-border-sm px-2 py-1 bg-white text-sm">
                <span class="text-sm">至</span>
                <input type="date" id="stat-end" class="sketch-border-sm px-2 py-1 bg-white text-sm">
                <button onclick="renderStats()" class="sketch-border-sm sketch-btn px-3 py-1 bg-blue-100 font-bold ml-2">查询</button>
                <button onclick="setQuickDate('week')" class="sketch-border-sm px-3 py-1 bg-white hover:bg-gray-100 ml-4">本周</button>
                <button onclick="setQuickDate('month')" class="sketch-border-sm px-3 py-1 bg-white hover:bg-gray-100">近30天</button>
            </div>
            
            <div id="modal-chart-container" class="flex items-end justify-around h-64 border-b-2 border-l-2 border-gray-800 pb-2 pl-2 mb-8 relative bg-white/50 rounded p-2"></div>
            
            <div>
                <h3 class="text-xl font-bold mb-4">该时段内的详细备注</h3>
                <div id="modal-history-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-64 overflow-y-auto p-2 sketch-border bg-gray-50"></div>
            </div>
        </div>
    </div>

    <!-- 个人数据分析弹窗 -->
    <div id="member-stats-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-[80]">
        <div class="sketch-border bg-[#fffdf5] p-6 max-w-6xl w-full mx-4 max-h-[90vh] overflow-y-auto relative">
            <button onclick="closeMemberStatsModal()" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 font-bold text-2xl">✖</button>
            <div class="flex items-center gap-4 mb-5">
                <div id="member-stats-avatar" class="w-14 h-14 shrink-0"></div>
                <div>
                    <h2 id="member-stats-title" class="text-2xl font-bold">个人数据分析</h2>
                    <p class="text-sm text-gray-500 font-bold">点击团队统计里的头像可查看个人明细</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 bg-yellow-50 p-2 sketch-border-sm mb-5 w-max max-w-full">
                <span class="font-bold text-sm">时间范围:</span>
                <input type="date" id="member-stat-start" class="sketch-border-sm px-2 py-1 bg-white text-sm">
                <span class="text-sm">至</span>
                <input type="date" id="member-stat-end" class="sketch-border-sm px-2 py-1 bg-white text-sm">
                <button onclick="renderMemberStats()" class="sketch-border-sm sketch-btn px-3 py-1 bg-blue-100 font-bold ml-1">查询</button>
                <button onclick="setMemberQuickDate('week')" class="sketch-border-sm px-3 py-1 bg-white hover:bg-gray-100 ml-2">本周</button>
                <button onclick="setMemberQuickDate('month')" class="sketch-border-sm px-3 py-1 bg-white hover:bg-gray-100">近30天</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
                <div class="sketch-border-sm bg-white p-4">
                    <p class="text-sm text-gray-500 font-bold">完成度</p>
                    <p id="member-stat-rate" class="text-4xl font-bold mt-2">0%</p>
                </div>
                <div class="sketch-border-sm bg-white p-4">
                    <p class="text-sm text-gray-500 font-bold">任务总数</p>
                    <p id="member-stat-total" class="text-4xl font-bold mt-2">0</p>
                </div>
                <div class="sketch-border-sm bg-white p-4">
                    <p class="text-sm text-gray-500 font-bold">已完成</p>
                    <p id="member-stat-done" class="text-4xl font-bold mt-2">0</p>
                </div>
            </div>

            <div class="sketch-border bg-gray-50 p-4">
                <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-2 mb-4">
                    <h3 class="text-xl font-bold">每日任务清单</h3>
                    <p class="text-xs text-gray-500 font-bold">默认显示本周；选择日期后，仅显示所选范围内的记录</p>
                </div>
                <div id="member-task-history" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 max-h-[55vh] overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <!-- 头像选择弹窗 -->
    <div id="avatar-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-50">
        <div class="sketch-border bg-[#fffdf5] p-6 max-w-lg w-full mx-4">
            <h2 class="text-xl font-bold mb-4">选择手绘头像</h2>
            <div id="avatar-grid" class="grid grid-cols-4 sm:grid-cols-5 gap-3 mb-6"></div>
            <div class="flex justify-between items-center pt-4 border-t-2 border-gray-200">
                <div>
                    <input type="file" id="avatar-upload" class="hidden" accept="image/*" onchange="handleAvatarUpload(event)">
                    <button onclick="document.getElementById('avatar-upload').click()" class="sketch-border sketch-btn px-4 py-2 bg-blue-100 font-bold text-blue-800">📸 上传自定义图片</button>
                </div>
                <button onclick="closeAvatarModal()" class="sketch-border sketch-btn px-4 py-2 bg-gray-200 font-bold">取消</button>
            </div>
        </div>
    </div>

    <!-- 默认任务库管理弹窗 -->
    <div id="task-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-50">
        <div class="sketch-border bg-[#fffdf5] p-6 max-w-4xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">默认任务库管理 (每行一个任务)</h2>
                <button onclick="closeTaskModal()" class="text-gray-500 hover:text-black font-bold text-xl">✖</button>
            </div>
            <div id="task-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>
            <div class="flex gap-4 mt-6">
                <button onclick="saveTaskModal(false)" class="sketch-border sketch-btn px-4 py-3 bg-gray-100 flex-1 font-bold text-gray-700">仅保存默认任务库</button>
                <button onclick="saveTaskModal(true)" class="sketch-border sketch-btn px-4 py-3 bg-green-200 flex-1 font-bold text-green-800">保存并立即重置今天看板</button>
            </div>
        </div>
    </div>

    <!-- 自定义高阶确认对话框弹窗 -->
    <div id="custom-confirm" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-[60]">
        <div class="sketch-border bg-[#fffdf5] p-6 max-w-sm w-full mx-4">
            <h3 class="text-lg font-bold mb-4 text-gray-800">💡 提示</h3>
            <p id="confirm-text" class="text-gray-600 mb-6"></p>
            <div class="flex gap-4 justify-end">
                <button id="confirm-cancel-btn" class="sketch-border sketch-btn px-4 py-2 bg-gray-200 font-bold">取消</button>
                <button id="confirm-ok-btn" class="sketch-border sketch-btn px-4 py-2 bg-red-100 text-red-700 font-bold">确定</button>
            </div>
        </div>
    </div>

    <!-- 自定义警告提示弹窗 -->
    <div id="custom-alert" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-[70]">
        <div class="sketch-border bg-[#fffdf5] p-6 max-w-sm w-full mx-4">
            <h3 class="text-lg font-bold mb-4 text-gray-800">📢 状态提示</h3>
            <p id="alert-text" class="text-gray-600 mb-6"></p>
            <button onclick="closeCustomAlert()" class="sketch-border sketch-btn px-4 py-2 bg-blue-100 font-bold w-full">我知道了</button>
        </div>
    </div>

        // =========================================================================
        // 💻 【核心粘贴位置】SUPABASE 数据库密钥在这里填写！
        // =========================================================================

        const SUPABASE_KEY = "sb_publishable_YRM7T9eLC2Qqf7kAO265mQ_IQ-YC-j4"; 
        // =========================================================================

        let supabaseClient = null;
        const BOARD_ID = 1;
        const getTodayLocal = () => {
            const d = new Date();
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().split('T')[0];
        };
        let TODAY = getTodayLocal(); 
        let currentEditingMemberId = null;
        let isSyncingCloud = false;
        let cloudSyncTimer = null;
        let realtimeChannel = null;
        let currentStatsMemberId = null;
        let currentRole = localStorage.getItem('sketchBoard_role_v1') || 'boss';
        let currentMemberId = localStorage.getItem('sketchBoard_memberId_v1') || '';

        // --- 简单防误触身份模式：不是安全登录，只用于避免误改别人内容 ---
        function isBoss() {
            return currentRole === 'boss';
        }

        function canEditMember(memberId) {
            return isBoss() || currentMemberId === memberId;
        }

        function getCurrentIdentityName() {
            if (isBoss()) return '老板';
            const member = members.find(m => m.id === currentMemberId);
            return member ? member.name : '未选择成员';
        }

        function showNoPermission() {
            showCustomAlert(`当前身份是【${getCurrentIdentityName()}】，只能编辑自己的模块和自己的默认任务。如需编辑全部内容，请切换为【老板】。`);
        }

        function ensureValidIdentity() {
            if (currentRole === 'member' && !members.some(m => m.id === currentMemberId)) {
                currentRole = 'boss';
                currentMemberId = '';
                localStorage.setItem('sketchBoard_role_v1', currentRole);
                localStorage.setItem('sketchBoard_memberId_v1', currentMemberId);
            }
        }

        function renderIdentitySelector() {
            ensureValidIdentity();
            const select = document.getElementById('identity-select');
            if (!select) return;
            const selectedValue = isBoss() ? 'boss' : currentMemberId;
            select.innerHTML = '<option value="boss">老板</option>' + members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
            select.value = selectedValue;
        }

        function switchIdentity(value) {
            if (value === 'boss') {
                currentRole = 'boss';
                currentMemberId = '';
            } else {
                currentRole = 'member';
                currentMemberId = value;
            }
            localStorage.setItem('sketchBoard_role_v1', currentRole);
            localStorage.setItem('sketchBoard_memberId_v1', currentMemberId);
            renderIdentitySelector();
            renderBoard();
            renderBottomStats();
            if(!document.getElementById('stats-modal').classList.contains('hidden')) renderStats();
            if(!document.getElementById('member-stats-modal').classList.contains('hidden')) renderMemberStats();
        }

            `<svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="35" fill="#faf089" stroke="#2d3748" stroke-width="3"/><path d="M45 20 L50 10 L55 20 Z" fill="#f6ad55" stroke="#2d3748" stroke-width="2"/><circle cx="40" cy="50" r="4" fill="#2d3748"/><circle cx="60" cy="50" r="4" fill="#2d3748"/><path d="M45 60 L55 60 L50 70 Z" fill="#f6ad55" stroke="#2d3748" stroke-width="2"/></svg>`
        ];

        const DEFAULT_MEMBERS = [
            { id: 'm1', name: 'SY', avatarId: 0, defaultTasks: ['需求分析', '原型设计更新'] },
            { id: 'm2', name: 'YCF', avatarId: 1, defaultTasks: ['前端首页重构', '修复导航栏Bug'] },
            { id: 'm3', name: 'LX', avatarId: 2, defaultTasks: ['后端API接口编写', '数据库表结构设计'] },
            { id: 'm4', name: 'LYF', avatarId: 3, defaultTasks: ['测试核心主链路', '编写测试用例'] }
        ];

        let members = [];
        let dailyRecords = {};
        let actionHistory = [];

        // 自定义提示组件控制
        function showCustomAlert(msg) {
            document.getElementById('alert-text').innerText = msg;
            document.getElementById('custom-alert').classList.remove('hidden');
        }
        function closeCustomAlert() {
            document.getElementById('custom-alert').classList.add('hidden');
        }

        function showCustomConfirm(msg, onOk) {
            document.getElementById('confirm-text').innerText = msg;
            const confirmBox = document.getElementById('custom-confirm');
            confirmBox.classList.remove('hidden');

            const btnOk = document.getElementById('confirm-ok-btn');
            const btnCancel = document.getElementById('confirm-cancel-btn');

            const clearEvents = () => {
                btnOk.onclick = null;
                btnCancel.onclick = null;
            };

            btnOk.onclick = () => {
                clearEvents();
                confirmBox.classList.add('hidden');
                if (onOk) onOk();
            };

            btnCancel.onclick = () => {
                clearEvents();
                confirmBox.classList.add('hidden');
            };
        }

        // --- 初始化与本地存储/云端多端同步逻辑 ---
        async function initData() {
            const statusEl = document.getElementById('sync-status');

            // 避免重复点击“云端状态”后创建多个实时监听
            if (realtimeChannel && supabaseClient) {
                await supabaseClient.removeChannel(realtimeChannel);
                realtimeChannel = null;
            }

            // 1. 初始化 Supabase 客户端
            try {
                if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
                    // 注意：这里必须是项目 URL，不能带 /rest/v1/
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                        realtime: { params: { eventsPerSecond: 10 } }
                    });
                }
            } catch(err) {
                console.error("Supabase 客户端初始化异常:", err);
                supabaseClient = null;
            }

            // 2. 本地缓存只作为离线兜底；云端连接成功后会被云端覆盖
            loadLocalBackup();
            if (members.length === 0) {
                members = JSON.parse(JSON.stringify(DEFAULT_MEMBERS));
                dailyRecords = {};
                actionHistory = [];
                checkMidnightReset();
                saveToLocalOnly();
            }

            if (supabaseClient) {
                statusEl.innerText = '☁️ 正在连接云端...';
                statusEl.className = "text-xs font-bold px-2 py-1 bg-yellow-100 text-yellow-700 rounded-full ml-2";

                try {
                    // 先读取唯一一条看板数据
                    const { data, error } = await supabaseClient
                        .from('board_state')
                        .select('id,members,dailyRecords,actionHistory,updated_at')
                        .eq('id', BOARD_ID)
                        .maybeSingle();

                    if (error) throw error;

                    if (data && Array.isArray(data.members) && data.members.length > 0) {
                        members = data.members;
                        dailyRecords = data.dailyRecords || {};
                        actionHistory = data.actionHistory || [];
                    } else {
                        // 云端没有数据时，用当前本地/默认数据初始化云端
                        checkMidnightReset();
                        const { error: insertError } = await supabaseClient
                            .from('board_state')
                            .upsert({
                                id: BOARD_ID,
                                members,
                                dailyRecords,
                                actionHistory,
                                updated_at: new Date().toISOString()
                            }, { onConflict: 'id' });

                        if (insertError) throw insertError;
                    }

                    checkMidnightReset();
                    saveToLocalOnly();

                    statusEl.innerText = '🟢 云端实时同步中';
                    statusEl.className = "text-xs font-bold px-2 py-1 bg-green-100 text-green-700 rounded-full ml-2";

                    // 监听 INSERT / UPDATE / DELETE，其他设备一改，这边自动刷新
                    realtimeChannel = supabaseClient
                        .channel('board-sync-channel')
                        .on('postgres_changes', {
                            event: '*',
                            schema: 'public',
                            table: 'board_state',
                            filter: `id=eq.${BOARD_ID}`
                        }, (payload) => {
                            if (isSyncingCloud) return;

                            const newData = payload.new;
                            if (!newData) return;

                            if (Array.isArray(newData.members) && newData.members.length > 0) members = newData.members;
                            dailyRecords = newData.dailyRecords || {};
                            actionHistory = newData.actionHistory || [];

                            checkMidnightReset();
                            saveToLocalOnly();
                            renderIdentitySelector();
                            renderBoard();
                            renderBottomStats();
                            renderHistoryLog();
                            if(!document.getElementById('member-stats-modal').classList.contains('hidden')) renderMemberStats();

                            statusEl.innerText = '🟢 已收到其他设备更新';
                            statusEl.className = "text-xs font-bold px-2 py-1 bg-green-100 text-green-700 rounded-full ml-2";
                        })
                        .subscribe((status, err) => {
                            if (status === 'SUBSCRIBED') {
                                statusEl.innerText = '🟢 云端实时同步中';
                                statusEl.className = "text-xs font-bold px-2 py-1 bg-green-100 text-green-700 rounded-full ml-2";
                            } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
                                console.warn("实时频道异常:", status, err);
                                statusEl.innerText = '⚠️ 已连数据库，但实时监听未开';
                                statusEl.className = "text-xs font-bold px-2 py-1 bg-orange-100 text-orange-700 rounded-full ml-2";
                            }
                        });

                } catch (e) {
                    console.error("云端加载失败:", e);
                    const msg = e?.message ? `：${e.message}` : '';
                    statusEl.innerText = '⚠️ 云端未同步，点我重试';
                    statusEl.className = "text-xs font-bold px-2 py-1 bg-red-100 text-red-700 rounded-full ml-2";
                    showCustomAlert(`云端连接失败${msg}\n\n请检查：1）Supabase URL 是否不带 /rest/v1/；2）board_state 表是否存在；3）RLS 策略是否允许读取和写入；4）Realtime 是否已开启。`);
                }
            } else {
                statusEl.innerText = '☁️ 离线模式：Supabase 未初始化';
                statusEl.className = "text-xs font-bold px-2 py-1 bg-gray-200 text-gray-700 rounded-full ml-2";
            }

            checkMidnightReset();
            renderIdentitySelector();

            setQuickDate('week');
            setBottomQuickDate('week');
            renderHistoryLog();
            renderBoard();
        }

        // 离线备用加载
        function loadLocalBackup() {
            try {
                const savedMembers = localStorage.getItem('sketchBoard_members_v4');
                const savedRecords = localStorage.getItem('sketchBoard_records_v4');
                const savedHistory = localStorage.getItem('sketchBoard_history_v4');

                if (savedMembers) members = JSON.parse(savedMembers);
                if (savedRecords) dailyRecords = JSON.parse(savedRecords);
                if (savedHistory) actionHistory = JSON.parse(savedHistory);
            } catch(e) {
                console.error("读取本地缓存失败", e);
            }
        }

        // 跨天自动重置：保留前一天未完成/进行中的任务，再追加当天默认任务
        function checkMidnightReset() {
            if (!dailyRecords[TODAY]) {
                const pastDates = Object.keys(dailyRecords).filter(d => d !== TODAY).sort().reverse();
                let lastDate = pastDates.length > 0 ? pastDates[0] : null;
                dailyRecords[TODAY] = {};

                members.forEach(m => {
                    let prevRemark = '';
                    let carryTasks = [];

                    if (lastDate && dailyRecords[lastDate] && dailyRecords[lastDate][m.id]) {
                        const prevRecord = dailyRecords[lastDate][m.id];
                        prevRemark = prevRecord.remark || '';

                        if (Array.isArray(prevRecord.tasks)) {
                            carryTasks = prevRecord.tasks
                                .filter(t => t && (t.status === 'red' || t.status === 'orange'))
                                .map(t => createTask(t.text, t.status, {
                                    carryOver: true,
                                    originDate: t.originDate || lastDate,
                                    carryDays: (t.carryDays || 0) + 1
                                }));
                        }
                    }

                    const todayDefaultTasks = m.defaultTasks.map(t => createTask(t, 'red', {
                        carryOver: false,
                        originDate: TODAY,
                        carryDays: 0
                    }));

                    dailyRecords[TODAY][m.id] = {
                        tasks: [...carryTasks, ...todayDefaultTasks],
                        remark: prevRemark
                    };
                });
            }
        }

        function saveToLocalOnly() {
            try {
                localStorage.setItem('sketchBoard_members_v4', JSON.stringify(members));
                localStorage.setItem('sketchBoard_records_v4', JSON.stringify(dailyRecords));
                localStorage.setItem('sketchBoard_history_v4', JSON.stringify(actionHistory));
            } catch(e) {
                console.error("写入本地缓存失败", e);
            }
        }

        // 核心同步广播引擎 (高可靠防冲突版)
        function syncToCloud() {
            if (!supabaseClient) return;
            clearTimeout(cloudSyncTimer);

            cloudSyncTimer = setTimeout(async () => {
                isSyncingCloud = true;
                const statusEl = document.getElementById('sync-status');

                try {
                    const { error } = await supabaseClient.from('board_state').upsert({
                        id: BOARD_ID,
                        members,
                        dailyRecords,
                        actionHistory,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'id' });

                    if (error) throw error;

                    statusEl.innerText = '🟢 已同步到云端';
                    statusEl.className = "text-xs font-bold px-2 py-1 bg-green-100 text-green-700 rounded-full ml-2";
                } catch(e) {
                    console.error("同步到云端失败:", e);
                    statusEl.innerText = '⚠️ 保存失败，点我重试';
                    statusEl.className = "text-xs font-bold px-2 py-1 bg-red-100 text-red-700 rounded-full ml-2";
                } finally {
                    setTimeout(() => { isSyncingCloud = false; }, 800);
                }
            }, 350);
        }

        function saveMembers() { saveToLocalOnly(); syncToCloud(); }
        function saveRecords() { saveToLocalOnly(); syncToCloud(); }
        function saveHistory() { saveToLocalOnly(); syncToCloud(); }

        function getAvatarHTML(member) {
            if (member.customAvatar) {
                return `<img src="${member.customAvatar}" class="w-full h-full object-cover rounded-full sketch-border-sm" alt="avatar" />`;
            }
            return AVATARS[member.avatarId];
        }

        function createTask(text, status = 'red', options = {}) {
            return {
                text,
                status,
                carryOver: !!options.carryOver,
                originDate: options.originDate || TODAY,
                carryDays: options.carryDays || 0
            };
        }

        function formatShortDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            return `${Number(parts[1])}.${Number(parts[2])}`;
        }

        function getCarryoverBadge(task) {
            if (!task || !task.carryOver) return '';
            return `<span class="carryover-badge text-red-800">${formatShortDate(task.originDate)}遗留</span>`;
        }

        function getTaskBgClass(task) {
            if (task.status === 'green') return 'task-bg-green';
            if (task.status === 'orange') return task.carryOver ? 'task-bg-orange-carry' : 'task-bg-orange';
            return task.carryOver ? 'task-bg-red-carry' : 'task-bg-red';
        }

        function getStatusEmoji(status) {
            if (status === 'green') return '✅';
            if (status === 'orange') return '🟠';
            return '🔴';
        }

        function logAction(memberId, actionText) {
            const member = members.find(m => m.id === memberId);
            if (!member) return;
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            actionHistory.unshift({
                id: Date.now(),
                date: TODAY,
                time: timeStr,
                memberName: member.name,
                avatarHtml: getAvatarHTML(member),
                text: actionText
            });

            if(actionHistory.length > 50) actionHistory.pop();
            saveHistory();
            renderHistoryLog();
        }

        function renderBoard() {
            const container = document.getElementById('card-container');
            container.innerHTML = '';
            const todayData = dailyRecords[TODAY] || {};

            const currentHour = new Date().getHours();
            const isLate = currentHour >= 18; // 18点后自动开始催办闪动

            members.forEach(member => {
                const data = todayData[member.id] || { tasks: [], remark: '' };
                const canEdit = canEditMember(member.id);
                const disabledHint = canEdit ? '' : `当前身份【${getCurrentIdentityName()}】不能编辑 ${member.name}`;
                const hasIncompleteTasks = data.tasks.some(t => t.status === 'red' || t.status === 'orange');
                const allDone = data.tasks.length > 0 && data.tasks.every(t => t.status === 'green');
                const alertClass = (isLate && hasIncompleteTasks) ? 'pulsing-alert' : '';
                const remarkOpacity = allDone ? 'opacity-60' : 'opacity-100';

                const tasksHTML = data.tasks.map((t, idx) => {
                    const bgClass = getTaskBgClass(t);
                    const doneClass = t.status === 'green' ? 'task-done' : '';
                    const carryBadge = getCarryoverBadge(t);
                    const disabledAttr = canEdit ? '' : 'disabled';
                    const disabledClass = canEdit ? '' : 'opacity-40 cursor-not-allowed';
                    const redClick = canEdit ? `onclick="setTaskStatus('${member.id}', ${idx}, 'red')"` : '';
                    const orangeClick = canEdit ? `onclick="setTaskStatus('${member.id}', ${idx}, 'orange')"` : '';
                    const greenClick = canEdit ? `onclick="setTaskStatus('${member.id}', ${idx}, 'green')"` : '';
                    const editAttr = canEdit ? `ondblclick="editTodayTask('${member.id}', ${idx}, this)" title="双击修改文字"` : `title="${disabledHint}"`;
                    const deleteBtn = canEdit ? `<button onclick="deleteTodayTask('${member.id}', ${idx})" class="text-lg text-red-400 opacity-0 group-hover:opacity-100 transition-opacity" title="删除">✖</button>` : '';
                    
                    return `
                    <div class="flex items-center gap-3 mb-3 group sketch-border-sm p-2 ${bgClass} transition-colors ${canEdit ? '' : 'opacity-80'}">
                        <div class="flex gap-1 shrink-0 bg-white p-1 sketch-border-sm rounded-full">
                            <button ${redClick} ${disabledAttr} class="w-4 h-4 rounded-full border-2 border-gray-800 ${disabledClass} ${t.status === 'red' ? 'bg-red-500 shadow-inner' : 'bg-white hover:bg-red-100'}" title="未开始"></button>
                            <button ${orangeClick} ${disabledAttr} class="w-4 h-4 rounded-full border-2 border-gray-800 ${disabledClass} ${t.status === 'orange' ? 'bg-orange-500 shadow-inner' : 'bg-white hover:bg-orange-100'}" title="进行中"></button>
                            <button ${greenClick} ${disabledAttr} class="w-4 h-4 rounded-full border-2 border-gray-800 ${disabledClass} ${t.status === 'green' ? 'bg-green-500 shadow-inner' : 'bg-white hover:bg-green-100'}" title="已完成"></button>
                        </div>
                        <div class="flex-1 text-base font-bold ${doneClass} ${canEdit ? 'cursor-text' : 'cursor-not-allowed'} break-all" ${editAttr}>${t.text}</div>
                        ${carryBadge}
                        ${deleteBtn}
                    </div>
                    `;
                }).join('');

                const avatarAttr = canEdit ? `onclick="openAvatarModal('${member.id}')" title="更换头像"` : `title="${disabledHint}"`;
                const nameEditAttr = canEdit ? `ondblclick="editMemberName('${member.id}', this)" title="双击修改名字"` : `title="${disabledHint}"`;
                const inputDisabled = canEdit ? '' : 'disabled';
                const inputClass = canEdit ? 'focus:bg-gray-50' : 'bg-gray-100 cursor-not-allowed opacity-70';
                const addBtn = canEdit
                    ? `<button onclick="addTodayTaskInline('${member.id}')" class="text-sm sketch-border-sm px-3 py-2 bg-gray-100 hover:bg-gray-200 font-bold shrink-0">添加</button>`
                    : `<button disabled class="text-sm sketch-border-sm px-3 py-2 bg-gray-100 font-bold shrink-0 opacity-50 cursor-not-allowed">添加</button>`;
                const permissionLabel = canEdit ? '' : `<span class="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded-full font-bold">只读</span>`;

                const cardHTML = `
                    <div class="sketch-border bg-white p-6 flex flex-col gap-4 relative transition-colors duration-300 min-h-[350px] ${canEdit ? '' : 'bg-gray-50'}">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 ${canEdit ? 'cursor-pointer hover:scale-105' : 'cursor-not-allowed opacity-80'} transition-transform select-none shrink-0" ${avatarAttr}>
                                ${getAvatarHTML(member)}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2">
                                    <h3 class="text-3xl font-bold tracking-wide truncate ${canEdit ? 'cursor-text' : 'cursor-not-allowed'} ${alertClass}" ${nameEditAttr}>${member.name}</h3>
                                    ${permissionLabel}
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex-1 mt-2">
                            <p class="text-sm text-gray-500 font-bold mb-3 border-b-2 border-gray-200 pb-1">🎯 今日任务明细:</p>
                            <div class="min-h-[5rem]">
                                ${tasksHTML || '<p class="text-gray-400 text-sm text-center py-4">今日暂无任务，快来添加吧！</p>'}
                            </div>
                            
                            <div class="flex items-center gap-2 mt-2">
                                <input type="text" id="add-task-input-${member.id}" class="flex-1 sketch-border-sm p-2 text-sm outline-none transition-colors ${inputClass}" placeholder="${canEdit ? '输入新任务...' : '当前身份不可编辑'}" ${inputDisabled} onkeypress="if(event.key === 'Enter') addTodayTaskInline('${member.id}')">
                                ${addBtn}
                            </div>
                        </div>

                        <div class="mt-4 ${remarkOpacity} transition-opacity bg-gray-50 p-3 sketch-border-sm">
                            <p class="text-sm text-gray-500 font-bold mb-2">📝 个人进度备注:</p>
                            <textarea class="w-full bg-transparent outline-none text-sm resize-none ${canEdit ? '' : 'cursor-not-allowed opacity-70'}" 
                                   rows="2"
                                   placeholder="${canEdit ? '遇到问题？留给明天的自己...' : '当前身份不可编辑'}" 
                                   ${inputDisabled}
                                   onblur="updateRemark('${member.id}', this.value)"
                                   onfocus="this.setAttribute('data-old', this.value)">${data.remark}</textarea>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function editMemberName(memberId, element) {
            if (!canEditMember(memberId)) { showNoPermission(); return; }
            const member = members.find(m => m.id === memberId);
            if (!member) return;
            element.outerHTML = `<input type="text" class="text-3xl font-bold tracking-wide sketch-border-sm bg-white p-1 max-w-[150px] outline-none" value="${member.name}" onblur="saveMemberName('${memberId}', this)" onkeypress="if(event.key === 'Enter') this.blur()" autofocus>`;
        }

        function saveMemberName(memberId, inputElement) {
            if (!canEditMember(memberId)) { showNoPermission(); renderBoard(); return; }
            const newName = inputElement.value.trim();
            if (newName) {
                const member = members.find(m => m.id === memberId);
                if (member) {
                    const oldName = member.name;
                    member.name = newName;
                    saveMembers();
                    logAction(memberId, `将名字从 [${oldName}] 修改为 [${newName}] ✏️`);
                    renderIdentitySelector();
                    renderBottomStats(); 
                }
            }
            renderBoard();
        }

        function setTaskStatus(memberId, taskIndex, newStatus) {
            if (!canEditMember(memberId)) { showNoPermission(); return; }
            const task = dailyRecords[TODAY][memberId].tasks[taskIndex];
            const oldStatus = task.status;
            task.status = newStatus;
            saveRecords();
            renderBoard();

            if (newStatus === 'green' && oldStatus !== 'green') {
                logAction(memberId, `打卡完成: [${task.text}] ✅`);
            }
            
            renderBottomStats();
            if(!document.getElementById('stats-modal').classList.contains('hidden')) renderStats();
            if(!document.getElementById('member-stats-modal').classList.contains('hidden')) renderMemberStats();
        }

        function addTodayTaskInline(memberId) {
            if (!canEditMember(memberId)) { showNoPermission(); return; }
            const inputEl = document.getElementById(`add-task-input-${memberId}`);
            const text = inputEl.value.trim();
            if (text) {
                dailyRecords[TODAY][memberId].tasks.push(createTask(text, 'red')); 
                saveRecords();
                renderBoard();
                inputEl.value = '';
                logAction(memberId, `新增了临时任务: [${text}]`);
                renderBottomStats();
            }
        }

        function deleteTodayTask(memberId, taskIndex) {
            if (!canEditMember(memberId)) { showNoPermission(); return; }
            dailyRecords[TODAY][memberId].tasks.splice(taskIndex, 1);
            saveRecords();
            renderBoard();
            renderBottomStats();
        }

        function editTodayTask(memberId, taskIndex, element) {
            if (!canEditMember(memberId)) { showNoPermission(); return; }
            const currentText = dailyRecords[TODAY][memberId].tasks[taskIndex].text;
            element.outerHTML = `<input type="text" class="flex-1 sketch-border-sm bg-white p-1 text-base font-bold outline-none" value="${currentText}" onblur="saveTodayTaskText('${memberId}', ${taskIndex}, this)" onkeypress="if(event.key === 'Enter') this.blur()" autofocus>`;
        }

        function saveTodayTaskText(memberId, taskIndex, inputElement) {
            if (!canEditMember(memberId)) { showNoPermission(); renderBoard(); return; }
            const newText = inputElement.value.trim();
            if (newText) {
                dailyRecords[TODAY][memberId].tasks[taskIndex].text = newText;
            } else {
                dailyRecords[TODAY][memberId].tasks.splice(taskIndex, 1);
            }
            saveRecords();
            renderBoard();
        }

        function updateRemark(memberId, newRemark) {
            if (!canEditMember(memberId)) { showNoPermission(); return; }
            const textarea = event.target;
            const oldRemark = textarea.getAttribute('data-old') || '';
            
            if(oldRemark !== newRemark) {
                dailyRecords[TODAY][memberId].remark = newRemark;
                saveRecords();
                if(newRemark.trim() !== '') {
                    logAction(memberId, `更新了备注: "${newRemark}"`);
                }
            }
        }

        function openAvatarModal(memberId) {
            if (!canEditMember(memberId)) { showNoPermission(); return; }
            currentEditingMemberId = memberId;
            const grid = document.getElementById('avatar-grid');
            grid.innerHTML = '';
            AVATARS.forEach((svg, index) => {
                grid.innerHTML += `
                    <div class="p-2 sketch-border sketch-btn flex items-center justify-center cursor-pointer hover:bg-gray-100 bg-white" onclick="selectAvatar(${index})">
                        <div class="w-16 h-16">${svg}</div>
                    </div>
                `;
            });
            document.getElementById('avatar-modal').classList.remove('hidden');
        }

        function closeAvatarModal() {
            document.getElementById('avatar-modal').classList.add('hidden');
            currentEditingMemberId = null;
        }

        function selectAvatar(avatarId) {
            if (currentEditingMemberId) {
                const member = members.find(m => m.id === currentEditingMemberId);
                if (member) {
                    member.avatarId = avatarId;
                    delete member.customAvatar; 
                    saveMembers();
                    renderBoard();
                    renderHistoryLog(); 
                }
            }
            closeAvatarModal();
        }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Str = e.target.result;
                    if (currentEditingMemberId) {
                        const member = members.find(m => m.id === currentEditingMemberId);
                        if (member) {
                            member.customAvatar = base64Str;
                            saveMembers();
                            renderBoard();
                            renderHistoryLog();
                        }
                    }
                    closeAvatarModal();
                };
                reader.readAsDataURL(file);
            }
        }

        function openTaskModal() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            members.forEach(member => {
                const canEdit = canEditMember(member.id);
                const tasksStr = member.defaultTasks.join('\n');
                const deleteBtn = isBoss() ? `<button onclick="deleteMember('${member.id}')" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 font-bold text-xl hover:scale-110">✖</button>` : '';
                const readonlyLabel = canEdit ? '' : `<span class="text-xs bg-gray-200 text-gray-500 px-2 py-1 rounded-full font-bold">只读</span>`;
                list.innerHTML += `
                    <div class="flex flex-col gap-2 bg-gray-50 p-4 sketch-border-sm relative ${canEdit ? '' : 'opacity-75'}">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-10 h-10">${getAvatarHTML(member)}</div>
                            <span class="font-bold text-xl">${member.name}</span>
                            ${readonlyLabel}
                        </div>
                        <textarea class="w-full sketch-border-sm p-3 bg-white text-sm ${canEdit ? '' : 'cursor-not-allowed bg-gray-100'}" rows="4" placeholder="输入默认任务，每行一个" ${canEdit ? '' : 'disabled'} onchange="updateDefaultTasks('${member.id}', this.value)">${tasksStr}</textarea>
                        ${deleteBtn}
                    </div>
                `;
            });
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function updateDefaultTasks(memberId, textValue) {
            if (!canEditMember(memberId)) { showNoPermission(); return; }
            const member = members.find(m => m.id === memberId);
            if (member) {
                member.defaultTasks = textValue.split('\n').map(t => t.trim()).filter(t => t !== '');
            }
        }

        function saveTaskModal(syncToToday) {
            saveMembers();
            if (syncToToday) {
                const targetMembers = isBoss() ? members : members.filter(m => m.id === currentMemberId);
                targetMembers.forEach(m => {
                    if (!dailyRecords[TODAY]) dailyRecords[TODAY] = {};
                    if (!dailyRecords[TODAY][m.id]) dailyRecords[TODAY][m.id] = { tasks: [], remark: '' };
                    dailyRecords[TODAY][m.id].tasks = m.defaultTasks.map(t => createTask(t, 'red')); 
                });
                saveRecords();
            }
            document.getElementById('task-modal').classList.add('hidden');
            renderBoard();
            renderBottomStats();
            showCustomAlert(isBoss() ? '默认任务库已保存。' : `已保存【${getCurrentIdentityName()}】自己的默认任务。`);
        }

        function closeTaskModal() {
            renderBoard(); 
            document.getElementById('task-modal').classList.add('hidden');
        }

        function deleteMember(memberId) {
            if (!isBoss()) { showCustomAlert('只有老板身份可以删除成员。'); return; }
            showCustomConfirm("确定要删除这个成员吗？历史数据不受影响。", () => {
                members = members.filter(m => m.id !== memberId);
                saveMembers();
                openTaskModal(); 
                renderBoard();
                renderBottomStats();
            });
        }

        function updateClock() {
            const now = new Date();
            const todayStr = getTodayLocal();
            
            if (todayStr !== TODAY) {
                TODAY = todayStr;
                checkMidnightReset();
                saveRecords(); 
                renderBoard();
            }

            const dateStr = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('current-time').innerText = `${dateStr} ${timeStr}`;
            
            renderBoard(); 
        }

        function renderHistoryLog() {
            const container = document.getElementById('action-history');
            container.innerHTML = '';
            if (actionHistory.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-sm mt-4">今天暂无任何动态...</p>';
                return;
            }
            
            actionHistory.forEach(log => {
                const isToday = log.date === TODAY;
                const dateLabel = isToday ? '今天' : log.date;
                container.innerHTML += `
                    <div class="flex gap-3 items-start p-2 bg-gray-50 sketch-border-sm">
                        <div class="w-8 h-8 shrink-0">${log.avatarHtml}</div>
                        <div class="flex-1">
                            <div class="flex justify-between items-end">
                                <span class="font-bold text-sm text-gray-800">${log.memberName}</span>
                                <span class="text-xs text-gray-400">${dateLabel} ${log.time}</span>
                            </div>
                            <p class="text-sm text-gray-600 mt-1">${log.text}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openMemberStatsModal(memberId) {
            currentStatsMemberId = memberId;
            const member = members.find(m => m.id === memberId);
            if (!member) return;

            document.getElementById('member-stats-title').innerText = `${member.name} 个人数据分析`;
            document.getElementById('member-stats-avatar').innerHTML = getAvatarHTML(member);
            document.getElementById('member-stats-modal').classList.remove('hidden');
            setMemberQuickDate('week');
        }

        function closeMemberStatsModal() {
            document.getElementById('member-stats-modal').classList.add('hidden');
            currentStatsMemberId = null;
        }

        function setMemberQuickDate(period) {
            const endInput = document.getElementById('member-stat-end');
            const startInput = document.getElementById('member-stat-start');
            const endDate = new Date();
            const startDate = new Date();
            if (period === 'week') startDate.setDate(endDate.getDate() - 6);
            else if (period === 'month') startDate.setDate(endDate.getDate() - 29);

            endInput.value = endDate.toISOString().split('T')[0];
            startInput.value = startDate.toISOString().split('T')[0];
            renderMemberStats();
        }

        function renderMemberStats() {
            if (!currentStatsMemberId) return;
            const member = members.find(m => m.id === currentStatsMemberId);
            if (!member) return;

            const startStr = document.getElementById('member-stat-start').value;
            const endStr = document.getElementById('member-stat-end').value;
            const historyEl = document.getElementById('member-task-history');
            historyEl.innerHTML = '';

            if (!startStr || !endStr || new Date(startStr) > new Date(endStr)) {
                historyEl.innerHTML = '<p class="text-red-500 font-bold">请选择正确的时间范围！</p>';
                return;
            }

            const dates = getDatesInRange(startStr, endStr);
            let totalScore = 0;
            let totalTasksCount = 0;
            let doneCount = 0;
            let hasAnyRecord = false;

            dates.forEach(date => {
                const record = dailyRecords[date] && dailyRecords[date][member.id];
                if (!record || !Array.isArray(record.tasks) || record.tasks.length === 0) return;
                hasAnyRecord = true;

                let taskRows = '';
                record.tasks.forEach(t => {
                    totalTasksCount++;
                    if (t.status === 'green') { totalScore += 100; doneCount++; }
                    else if (t.status === 'orange') totalScore += 50;

                    const carryText = t.carryOver ? `<span class="carryover-badge text-red-800 ml-2">${formatShortDate(t.originDate)}遗留</span>` : '';
                    const statusText = t.status === 'green' ? '已完成' : (t.status === 'orange' ? '进行中' : '未开始');
                    taskRows += `
                        <div class="flex items-start gap-2 p-2 bg-gray-50 sketch-border-sm">
                            <span class="text-lg leading-5">${getStatusEmoji(t.status)}</span>
                            <div class="flex-1 min-w-0">
                                <div class="font-bold break-all">${t.text} ${carryText}</div>
                                <div class="text-xs text-gray-500 mt-1">${statusText}</div>
                            </div>
                        </div>
                    `;
                });

                if (record.remark && record.remark.trim() !== '') {
                    taskRows += `
                        <div class="p-2 bg-yellow-50 sketch-border-sm text-sm">
                            <span class="font-bold">备注：</span>${record.remark}
                        </div>
                    `;
                }

                historyEl.innerHTML += `
                    <div class="sketch-border-sm bg-white p-3 min-h-[170px] flex flex-col">
                        <div class="font-bold text-gray-800 mb-2 pb-1 border-b-2 border-gray-200 flex justify-between items-center">
                            <span>${date}</span>
                            <span class="text-xs text-gray-400">${record.tasks.length}项</span>
                        </div>
                        <div class="flex flex-col gap-2 flex-1 overflow-y-auto max-h-64 pr-1">${taskRows}</div>
                    </div>
                `;
            });

            const rate = totalTasksCount === 0 ? 0 : Math.round(totalScore / totalTasksCount);
            document.getElementById('member-stat-rate').innerText = `${rate}%`;
            document.getElementById('member-stat-total').innerText = totalTasksCount;
            document.getElementById('member-stat-done').innerText = doneCount;

            if (!hasAnyRecord) {
                historyEl.innerHTML = '<p class="text-gray-400 p-4">该时间段内暂无任务记录。</p>';
            }
        }

        function openStatsModal() {
            document.getElementById('stats-modal').classList.remove('hidden');
            renderStats();
        }

        function closeStatsModal() {
            document.getElementById('stats-modal').classList.add('hidden');
        }

        function setQuickDate(period) {
            const endInput = document.getElementById('stat-end');
            const startInput = document.getElementById('stat-start');
            const endDate = new Date();
            const startDate = new Date();
            if (period === 'week') startDate.setDate(endDate.getDate() - 6);
            else if (period === 'month') startDate.setDate(endDate.getDate() - 29);

            endInput.value = endDate.toISOString().split('T')[0];
            startInput.value = startDate.toISOString().split('T')[0];
            renderStats();
        }

        function setBottomQuickDate(period) {
            const endInput = document.getElementById('bottom-stat-end');
            const startInput = document.getElementById('bottom-stat-start');
            const endDate = new Date();
            const startDate = new Date();
            if (period === 'week') startDate.setDate(endDate.getDate() - 6);
            else if (period === 'month') startDate.setDate(endDate.getDate() - 29);

            endInput.value = endDate.toISOString().split('T')[0];
            startInput.value = startDate.toISOString().split('T')[0];
            renderBottomStats();
        }

        function getDatesInRange(startStr, endStr) {
            const dates = [];
            let current = new Date(startStr);
            const end = new Date(endStr);
            while (current <= end) {
                dates.push(current.toISOString().split('T')[0]);
                current.setDate(current.getDate() + 1);
            }
            return dates;
        }

        function renderStats() {
            const modalChartContainer = document.getElementById('modal-chart-container');
            const historyContainer = document.getElementById('modal-history-container');
            
            modalChartContainer.innerHTML = '';
            historyContainer.innerHTML = '';

            const startStr = document.getElementById('stat-start').value;
            const endStr = document.getElementById('stat-end').value;
            
            if (!startStr || !endStr || new Date(startStr) > new Date(endStr)) {
                modalChartContainer.innerHTML = '<p class="text-red-500 m-auto font-bold">请选择正确的时间范围！</p>';
                return;
            }

            const dates = getDatesInRange(startStr, endStr);

            members.forEach(member => {
                let totalScore = 0;
                let totalTasksCount = 0;
                
                dates.forEach(date => {
                    if (dailyRecords[date] && dailyRecords[date][member.id]) {
                        const record = dailyRecords[date][member.id];
                        if (record.tasks && record.tasks.length > 0) {
                            record.tasks.forEach(t => {
                                totalTasksCount++;
                                if (t.status === 'green') totalScore += 100;
                                else if (t.status === 'orange') totalScore += 50;
                            });
                        }
                        
                        if (record.remark && record.remark.trim() !== '') {
                            historyContainer.innerHTML += `
                                <div class="bg-white p-3 sketch-border-sm mb-2 text-sm">
                                    <span class="font-bold text-gray-800">${member.name} (${date}):</span> 
                                    <span class="text-gray-600">${record.remark}</span>
                                </div>
                            `;
                        }
                    }
                });

                const rate = totalTasksCount === 0 ? 0 : Math.round(totalScore / totalTasksCount);
                const barHeight = rate === 0 ? 5 : (rate / 100) * 200;
                
                modalChartContainer.innerHTML += `
                    <div class="flex flex-col items-center group relative w-12 md:w-16">
                        <div class="absolute -top-8 bg-gray-800 text-white px-2 py-1 sketch-border-sm text-xs opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10">
                            完成度: ${rate}%
                        </div>
                        <div class="w-6 md:w-8 sketch-border bg-[#D1FAE5] transition-all duration-700 relative overflow-hidden" style="height: ${barHeight}px;">
                            <div class="absolute inset-0 opacity-30" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.1) 5px, rgba(0,0,0,0.1) 10px);"></div>
                        </div>
                        <div onclick="openMemberStatsModal('${member.id}')" title="查看${member.name}个人数据" class="mt-2 flex items-center justify-center w-10 h-10 md:w-12 md:h-12 select-none stats-avatar-clickable transition-transform">
                            ${getAvatarHTML(member)}
                        </div>
                        <span class="text-xs md:text-sm mt-1 font-bold truncate w-full text-center">${member.name}</span>
                    </div>
                `;
            });

            if (historyContainer.innerHTML === '') {
                historyContainer.innerHTML = '<p class="text-gray-400 p-4">该时间段内暂无备注记录。</p>';
            }
        }

        function renderBottomStats() {
            const bottomChartContainer = document.getElementById('bottom-chart-container');
            bottomChartContainer.innerHTML = '';

            const startStr = document.getElementById('bottom-stat-start').value;
            const endStr = document.getElementById('bottom-stat-end').value;
            
            if (!startStr || !endStr || new Date(startStr) > new Date(endStr)) {
                bottomChartContainer.innerHTML = '<p class="text-red-500 m-auto font-bold text-sm">请选择正确的时间范围！</p>';
                return;
            }

            const dates = getDatesInRange(startStr, endStr);

            members.forEach(member => {
                let totalScore = 0;
                let totalTasksCount = 0;
                
                dates.forEach(date => {
                    if (dailyRecords[date] && dailyRecords[date][member.id]) {
                        const record = dailyRecords[date][member.id];
                        if (record.tasks && record.tasks.length > 0) {
                            record.tasks.forEach(t => {
                                totalTasksCount++;
                                if (t.status === 'green') totalScore += 100;
                                else if (t.status === 'orange') totalScore += 50;
                            });
                        }
                    }
                });

                const rate = totalTasksCount === 0 ? 0 : Math.round(totalScore / totalTasksCount);
                const barHeight = rate === 0 ? 5 : (rate / 100) * 140; // 底部最高140px

                bottomChartContainer.innerHTML += `
                    <div class="flex flex-col items-center group relative w-12 md:w-16">
                        <div class="absolute -top-8 bg-gray-800 text-white px-2 py-1 sketch-border-sm text-xs opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap z-10">
                            完成度: ${rate}%
                        </div>
                        <div class="w-6 md:w-8 sketch-border bg-[#D1FAE5] transition-all duration-700 relative overflow-hidden" style="height: ${barHeight}px;">
                            <div class="absolute inset-0 opacity-30" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.1) 5px, rgba(0,0,0,0.1) 10px);"></div>
                        </div>
                        <div onclick="openMemberStatsModal('${member.id}')" title="查看${member.name}个人数据" class="mt-2 flex items-center justify-center w-10 h-10 md:w-12 md:h-12 select-none stats-avatar-clickable transition-transform">
                            ${getAvatarHTML(member)}
                        </div>
                        <span class="text-xs md:text-sm mt-1 font-bold truncate w-full text-center">${member.name}</span>
                    </div>
                `;
            });
        }

        // --- 启动执行 ---
        window.onload = async () => {
            await initData();
            updateClock(); 
            setInterval(updateClock, 60000); 
        };

    </script>
</body>
</html>
